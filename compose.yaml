# docker compose up -d  —— 一条命令起全套（应用 + 数据库）
#
# 与"单容器 + 宿主机 MySQL"的区别：
#   - 数据库也在容器里，别人 clone 下来不用自己装 MySQL
#   - 容器之间用「服务名」互相访问（app 里 DB_HOST=db，db 就是服务名）
#
# 变量从同目录的 .env 自动读取（compose 自带这个行为）。
# 带 :? 的写法表示「必须设置，否则启动时报错并显示提示」——避免用默认密码蒙混过去。

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # root 密码只在初始化时使用，应用本身不用 root 连接
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 里设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?请在 .env 里设置 DB_NAME}
      # 应用专用账号：只对 MYSQL_DATABASE 有权限，不能管其他库、不能建用户
      MYSQL_USER: ${DB_APP_USER:?请在 .env 里设置 DB_APP_USER}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?请在 .env 里设置 DB_APP_PASSWORD}
    volumes:
      # 数据持久化：不加这个，docker compose down 之后数据全丢
      - db_data:/var/lib/mysql
      # 首次初始化时按文件名顺序执行 .sql —— 001~006 依次跑完，schema 就完整了。
      # 这正是「把每次表结构变更写成迁移文件」的回报：一条命令重建整个库。
      # 注意：只在数据目录为空（首次启动）时执行，之后不会重复跑。
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 让 app 等数据库真的能连了再启动；否则第一条请求会 503
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 关键：容器里的主机名是服务名 db，不是 127.0.0.1
      # （127.0.0.1 在容器里指容器自己）
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME}
      DEBUG: ${DEBUG:-false}
      REGISTER_OPEN: ${REGISTER_OPEN:-false}
      REGISTER_CODE: ${REGISTER_CODE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # 助手的联网搜索工具。
      # 注意：这里是**白名单**——.env 里有不等于容器能看到，
      # 只有在这个列表里出现过的变量才会被注入容器。
      # 忘了加会导致"改了 .env 但助手还说搜不到"（已踩过）。
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  # 定时备份：启动时立刻备一份，之后每 BACKUP_INTERVAL 秒一次，只留最近 N 天。
  # 用 mysql:8.0 镜像是为了拿到 mysqldump 客户端，不需要额外镜像。
  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 里设置 DB_ROOT_PASSWORD}
      BACKUP_KEEP_DAYS: "14"
      BACKUP_INTERVAL: "86400"
    volumes:
      # 备份文件直接落到宿主机目录，能在资源管理器里看到、也能拷到网盘
      - ./backups:/backup
    command:
      - sh
      - -c
      - |
        while true; do
          out="/backup/job-tracker-$$(date +%Y-%m-%d).sql.gz"

          # --single-transaction: InnoDB 一致性快照，不加锁，不阻塞读写
          # --quick: 边读边发，不在内存里攒整表
          if mysqldump --single-transaction --quick \
               -h db -u root -p"$$MYSQL_ROOT_PASSWORD" job_tracker | gzip > "$$out"; then
            if gzip -t "$$out"; then
              echo "[$$(date '+%Y-%m-%d %H:%M:%S')] 备份成功 $$out ($$(du -h "$$out" | cut -f1))"
            else
              echo "[$$(date '+%Y-%m-%d %H:%M:%S')] 备份文件校验失败，已删除"
              rm -f "$$out"
            fi
          else
            echo "[$$(date '+%Y-%m-%d %H:%M:%S')] mysqldump 失败，已删除残缺文件"
            rm -f "$$out"
          fi

          find /backup -name 'job-tracker-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep "$$BACKUP_INTERVAL"
        done

volumes:
  db_data:
