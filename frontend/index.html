<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>投递记录</title>
  <link rel="stylesheet" href="/static-ui/style.css">
</head>
<body>

<!-- ========== 启动中 ========== -->
<!-- 默认显示它，登录页和主界面都隐藏。
     否则刷新时会先闪一下登录表单（要等 /users/me 返回），看起来像"被登出了"。 -->
<section id="view-boot" class="view boot-view">
  <div class="boot-spinner" aria-label="加载中"></div>
</section>

<!-- ========== 登录 / 注册 ========== -->
<section id="view-login" class="view" hidden>
  <div class="login-card">
    <h1>投递记录</h1>
    <p class="sub">记录投递进度，评估岗位匹配度</p>

    <!-- 登录 -->
    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input name="name" type="text" autocomplete="username"
               required minlength="2" maxlength="20" inputmode="text">
      </label>

      <label class="field">
        <span>密码</span>
        <input name="password" type="password" autocomplete="current-password"
               required minlength="6" maxlength="64">
      </label>

      <p class="msg error" id="login-msg" hidden></p>
      <button type="submit" class="primary" id="btn-login">登录</button>
    </form>

    <!-- 注册（受限开放：需要邀请码） -->
    <form id="register-form" autocomplete="on" hidden>
      <label class="field">
        <span>用户名（2–20 字）</span>
        <input name="name" type="text" autocomplete="username"
               required minlength="2" maxlength="20">
      </label>

      <label class="field">
        <span>密码（6–64 位）</span>
        <input name="password" type="password" autocomplete="new-password"
               required minlength="6" maxlength="64">
      </label>

      <label class="field">
        <span>确认密码</span>
        <input name="password2" type="password" autocomplete="new-password"
               required minlength="6" maxlength="64">
      </label>

      <label class="field">
        <span>邀请码</span>
        <input name="code" type="text" autocomplete="off" placeholder="向管理员索取">
      </label>

      <p class="msg error" id="register-msg" hidden></p>
      <button type="submit" class="primary" id="btn-register">注册并登录</button>
    </form>

    <button type="button" id="btn-toggle-mode" class="link">没有账号？用邀请码注册</button>
  </div>
</section>

<!-- ========== 主界面 ========== -->
<section id="view-app" class="view" hidden>
  <header class="topbar">
    <strong>投递记录</strong>
    <div class="topbar-right">
      <span id="whoami" class="whoami"></span>
      <button id="btn-profile" class="ghost small" title="AI 分析会读这份简历">简历</button>
      <button id="btn-logout" class="ghost small">登出</button>
    </div>
  </header>

  <div class="toolbar">
    <button id="btn-new" class="primary small">+ 新增</button>
    <button id="btn-shot" class="ghost small" title="也可以直接 Ctrl+V 粘贴截图">截图导入</button>
    <button id="btn-refresh" class="ghost small">刷新</button>

    <input id="q-input" class="toolbar-search" type="search" maxlength="50"
           placeholder="搜公司 / 岗位 / 业务" autocomplete="off">

    <select id="group-by" class="small toolbar-sel" aria-label="分组方式">
      <option value="score">按匹配度分组</option>
      <option value="source">按渠道分组</option>
    </select>

    <select id="filter-status" class="small toolbar-sel" aria-label="按状态筛选">
      <option value="">全部状态</option>
      <option value="待投">待投</option>
      <option value="已投">已投</option>
      <option value="预约面试">预约面试</option>
      <option value="已面试">已面试</option>
      <option value="已挂">已挂</option>
    </select>
  </div>
  <input type="file" id="file-shot" accept="image/*" hidden>
  <p class="toolbar-tip">截图后回到这个页面按 <b>Ctrl+V</b>（点一下页面空白处，让焦点离开输入框），或点「截图导入」，AI 自动填好岗位信息</p>

  <!-- 筛选提示：让"正在筛选"这件事可见，避免误以为数据丢了 -->
  <div class="filter-hint" id="filter-hint" hidden>
    <span id="filter-hint-text"></span>
    <button type="button" id="btn-clear-filter">清除筛选</button>
  </div>

  <main id="list" class="list" aria-live="polite"></main>

  <!-- 助手入口：只在这个视图里出现（浮在列表右下角） -->
  <button type="button" id="btn-assistant" class="fab" aria-label="打开助手">助手</button>
</section>

<!-- ========== 新增 / 编辑 ========== -->
<dialog id="dlg-job" class="dialog">
  <form id="job-form" method="dialog">
    <h2 id="dlg-title">新增投递</h2>

    <p class="msg ok" id="draft-hint" hidden></p>

    <div class="grid2">
      <label class="field">
        <span>公司 *</span>
        <input name="company" type="text" required maxlength="100">
      </label>
      <label class="field">
        <span>岗位 *</span>
        <input name="position" type="text" required maxlength="100">
      </label>
    </div>

    <div class="grid2">
      <label class="field">
        <span>状态</span>
        <select name="status">
          <option value="待投">待投</option>
          <option value="已投">已投</option>
          <option value="预约面试">预约面试</option>
          <option value="已面试">已面试</option>
          <option value="已挂">已挂</option>
        </select>
      </label>
      <label class="field">
        <span>来源</span>
        <select name="source">
          <option value="其他">其他</option>
          <option value="本校">本校</option>
          <option value="Boss直聘">Boss直聘</option>
          <option value="自定义">自定义</option>
        </select>
      </label>
    </div>

    <label class="field">
      <span>来源补充（平台名 / 内推人）</span>
      <input name="source_detail" type="text" maxlength="100">
    </label>

    <div class="grid2">
      <label class="field">
        <span>薪资下限（千元/月）</span>
        <input name="salary_min" type="number" min="0" max="1000" inputmode="numeric">
      </label>
      <label class="field">
        <span>薪资上限（千元/月）</span>
        <input name="salary_max" type="number" min="0" max="1000" inputmode="numeric">
      </label>
    </div>

    <label class="field">
      <span>薪资备注</span>
      <input name="salary_note" type="text" maxlength="50" placeholder="如：13薪 / 试用期八折">
    </label>

    <label class="field">
      <span>岗位详情链接（看 JD 的地方）</span>
      <input name="url" type="text" maxlength="500" inputmode="url" placeholder="Boss 岗位页 / 官网职位描述">
    </label>

    <label class="field">
      <span>投递链接（真正提交简历的入口，可留空）</span>
      <input name="apply_url" type="text" maxlength="500" inputmode="url"
             placeholder="OfferShow / 官网招聘页。Boss 岗位通常没有，留空即可">
    </label>

    <div class="grid2">
      <label class="field">
        <span>发布时间</span>
        <input name="published_at" type="date">
      </label>
      <label class="field">
        <span>下次面试时间</span>
        <input name="next_interview_at" type="datetime-local">
      </label>
    </div>

    <label class="field">
      <span>公司业务</span>
      <input name="company_business" type="text" maxlength="200" placeholder="如：企业级 SaaS">
    </label>

    <label class="field">
      <span>JD 原文（粘贴招聘文案，AI 分析要用）</span>
      <textarea name="description" rows="6" placeholder="把 Boss 直聘 / 官网上的岗位描述整段粘进来"></textarea>
    </label>

    <label class="field">
      <span>备注</span>
      <textarea name="note" rows="3" placeholder="HR 说了什么、自己要注意什么"></textarea>
    </label>

    <p class="msg error" id="form-msg" hidden></p>

    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-cancel">取消</button>
      <button type="submit" class="primary" id="btn-save">保存</button>
    </div>
  </form>
</dialog>

<!-- ========== 我的简历 ========== -->
<dialog id="dlg-profile" class="dialog">
  <form id="profile-form" method="dialog">
    <h2>我的简历</h2>

    <p class="msg" id="profile-status" hidden></p>

    <p class="hint">
      AI 岗位匹配分析会读这份简历。可以上传 PDF / DOCX / 图片，也可以直接粘贴文字。
      解析结果请核对——机器可能认错字。
    </p>

    <div class="card-actions">
      <button type="button" class="ghost small" id="btn-profile-upload">上传文件</button>
      <input type="file" id="file-profile" accept=".pdf,.docx,.txt,.md,image/*" hidden>
    </div>

    <label class="field">
      <span>简历文本（可直接编辑）</span>
      <textarea name="text" rows="14" placeholder="把简历内容粘贴进来，或点上面的「上传文件」"></textarea>
    </label>

    <p class="msg error" id="profile-msg" hidden></p>

    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-profile-clear">清空</button>
      <button type="button" class="ghost" id="btn-profile-cancel">取消</button>
      <button type="submit" class="primary" id="btn-profile-save">保存</button>
    </div>
  </form>
</dialog>

<!-- ========== 助手（独立视图，不是弹窗覆盖） ========== -->
<!-- 用 view 而不是 dialog：助手是一个"页面"，有返回动作。
     弹窗会盖住岗位列表，用户失去了"我在哪"的空间感。 -->
<section id="view-assistant" class="view assistant-view" hidden>
  <header class="assistant-head">
    <button type="button" class="ghost small" id="btn-assistant-back">← 返回</button>
    <div class="assistant-title">
      <strong>助手</strong>
      <span id="assistant-sub">岗位库管理员 · 能联网查公司</span>
    </div>
    <button type="button" class="ghost small" id="btn-assistant-clear">清空</button>
  </header>

  <div class="assistant-log" id="assistant-log"></div>

  <div class="assistant-quick" id="assistant-quick">
    <button type="button" class="ghost small" data-q="我的岗位库里哪些最值得先准备？">先准备哪些</button>
    <button type="button" class="ghost small" data-q="按我现在的情况，接下来该做什么？">下一步做什么</button>
    <button type="button" class="ghost small" data-q="我简历里最该补强的是什么？">补强建议</button>
  </div>

  <form id="assistant-form" class="assistant-input">
    <input name="content" type="text" autocomplete="off" maxlength="2000"
           placeholder="问点什么…（例如：沐瞳这家公司是做什么的）">
    <button type="submit" class="primary small" id="btn-assistant-send">发送</button>
  </form>
</section>

<div id="toast" class="toast" hidden></div>
<script src="/static-ui/app.js"></script>
</body>
</html>
